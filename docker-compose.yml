# Home SOC Lab
# Services are added stage by stage:
#   Stage 1: wazuh.manager, wazuh.indexer, wazuh.dashboard
#   Stage 2: victims with Wazuh agents on the isolated "lab" network
#   Stage 3: Suricata watching the lab network, alerts shipped to Wazuh
#
# Based on the official wazuh-docker single-node deployment (v4.14.10).
# Run ./scripts/setup.sh once before the first `docker compose up -d`.
name: home-soc-lab

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:?set WAZUH_VERSION in .env}
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    # Agent ports 1514/1515 are NOT published: agents join over the Docker
    # network (Stage 2). The API is reachable from this laptop only.
    ports:
      - "127.0.0.1:55000:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?set INDEXER_PASSWORD in .env}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD:?set API_PASSWORD in .env}
      # Substituted into ossec.conf by the image's init script
      WAZUH_CLUSTER_KEY: ${WAZUH_CLUSTER_KEY:?set WAZUH_CLUSTER_KEY in .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Custom decoders (copied into /var/ossec/etc/decoders at start)
      - ./wazuh/decoders/mariadb_decoders.xml:/wazuh-config-mount/etc/decoders/mariadb_decoders.xml:ro
      # Custom rules (copied into /var/ossec/etc/rules at start)
      - ./wazuh/rules/home_soc_lab_rules.xml:/wazuh-config-mount/etc/rules/home_soc_lab_rules.xml:ro
      # Generated by scripts/setup.sh from .env (gitignored)
      - ./wazuh/config/wazuh_cluster/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
    # "default" reaches the indexer; "lab" is where the agents connect from
    networks:
      - default
      - lab

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      # Heap capped at 1 GB: the host has 7.5 GiB RAM in total.
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      # Generated by scripts/setup.sh from .env (gitignored)
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:5601"
    environment:
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # Generated by scripts/setup.sh from .env (gitignored)
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager

  # ---------------------------------------------------------------- Stage 2
  # Victims. DELIBERATELY VULNERABLE: they live only on the "lab" network,
  # which has no internet access and publishes no ports on the host.

  victim-ssh:
    build:
      context: ./victims
      dockerfile: ssh/Dockerfile
      args:
        WAZUH_AGENT_VERSION: ${WAZUH_VERSION}
    image: home-soc-lab/victim-ssh:${WAZUH_VERSION}
    hostname: victim-ssh
    restart: unless-stopped
    environment:
      VICTIM_SSH_USER: ${VICTIM_SSH_USER:?set VICTIM_SSH_USER in .env}
      VICTIM_SSH_PASSWORD: ${VICTIM_SSH_PASSWORD:?set VICTIM_SSH_PASSWORD in .env}
      ADMIN_SSH_USER: ${ADMIN_SSH_USER:-}
      ADMIN_SSH_PASSWORD: ${ADMIN_SSH_PASSWORD:-}
    secrets:
      - wazuh_enrollment
    networks:
      - lab
    depends_on:
      - wazuh.manager

  juice-shop:
    image: bkimminich/juice-shop:v20.4.0
    hostname: juice-shop
    restart: unless-stopped
    networks:
      - lab

  victim-web:
    build:
      context: ./victims
      dockerfile: web/Dockerfile
      args:
        WAZUH_AGENT_VERSION: ${WAZUH_VERSION}
    image: home-soc-lab/victim-web:${WAZUH_VERSION}
    hostname: victim-web
    restart: unless-stopped
    secrets:
      - wazuh_enrollment
    networks:
      - lab
    depends_on:
      - juice-shop
      - wazuh.manager

  victim-db:
    build:
      context: ./victims
      dockerfile: db/Dockerfile
      args:
        WAZUH_AGENT_VERSION: ${WAZUH_VERSION}
    image: home-soc-lab/victim-db:${WAZUH_VERSION}
    hostname: victim-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${VICTIM_DB_ROOT_PASSWORD:?set VICTIM_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: shop
      MARIADB_USER: ${VICTIM_DB_USER:?set VICTIM_DB_USER in .env}
      MARIADB_PASSWORD: ${VICTIM_DB_PASSWORD:?set VICTIM_DB_PASSWORD in .env}
    volumes:
      - victim-db-data:/var/lib/mysql
    secrets:
      - wazuh_enrollment
    networks:
      - lab
    depends_on:
      - wazuh.manager

  # ---------------------------------------------------------------- Stage 3
  # Network IDS. Suricata uses the host network namespace so it can capture
  # on the lab bridge (br-soclab) and see traffic between all lab containers.
  # It listens on no ports. Its alerts go to a shared volume that the
  # nids-sensor agent (on the lab network) ships to the Wazuh manager.

  suricata:
    image: jasonish/suricata:8.0.8
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      SURICATA_INTERFACE: br-soclab
      LAB_SUBNET: ${LAB_SUBNET}
      ATTACKER_IP: ${ATTACKER_IP}
    entrypoint: ["/lab/start.sh"]
    volumes:
      - ./suricata/start.sh:/lab/start.sh:ro
      - ./suricata/lab.yaml:/lab/lab.yaml:ro
      - ./suricata/rules/local.rules:/lab/rules/local.rules:ro
      - suricata-rules:/var/lib/suricata
      - suricata-logs:/var/log/suricata
    depends_on:
      # the lab network (and its bridge) must exist before capture starts
      - victim-web

  nids-sensor:
    build:
      context: ./suricata/sensor
      additional_contexts:
        common: ./victims/common
      args:
        WAZUH_AGENT_VERSION: ${WAZUH_VERSION}
    image: home-soc-lab/nids-sensor:${WAZUH_VERSION}
    hostname: nids-sensor
    restart: unless-stopped
    volumes:
      - suricata-logs:/var/log/suricata:ro
    secrets:
      - wazuh_enrollment
    networks:
      - lab
    depends_on:
      - suricata
      - wazuh.manager

  # ---------------------------------------------------------------- Stage 4
  # Attacker. Only started on demand:
  #   docker compose --profile attack run --rm attacker /attacks/01-port-scan.sh
  # Lives on the lab network only (no internet, no host ports).

  attacker:
    build:
      context: ./attacker
    image: home-soc-lab/attacker:latest
    hostname: attacker
    profiles: ["attack"]
    environment:
      VICTIM_SSH_USER: ${VICTIM_SSH_USER}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./attacks:/attacks:ro
      - ./attacks/output:/output
    networks:
      lab:
        ipv4_address: ${ATTACKER_IP:?set ATTACKER_IP in .env}

  # Normal activity baseline. A workstation using the lab the way legitimate
  # users do (web shopping, admin SSH, app database queries), so attacks can
  # be compared with normal traffic. Same tool image as the attacker, but a
  # different address and only legitimate credentials. On demand:
  #   docker compose --profile normal run --rm normal-user /normal/normal-activity.sh
  normal-user:
    image: home-soc-lab/attacker:latest
    hostname: workstation
    profiles: ["normal"]
    environment:
      DURATION: ${NORMAL_DURATION:-600}
      ADMIN_SSH_USER: ${ADMIN_SSH_USER:?set ADMIN_SSH_USER in .env}
      ADMIN_SSH_PASSWORD: ${ADMIN_SSH_PASSWORD:?set ADMIN_SSH_PASSWORD in .env}
      SHOP_CUSTOMER_EMAIL: ${SHOP_CUSTOMER_EMAIL:?set SHOP_CUSTOMER_EMAIL in .env}
      SHOP_CUSTOMER_PASSWORD: ${SHOP_CUSTOMER_PASSWORD:?set SHOP_CUSTOMER_PASSWORD in .env}
      DB_USER: ${VICTIM_DB_USER}
      DB_PASSWORD: ${VICTIM_DB_PASSWORD}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./normal:/normal:ro
      - ./attacks/output:/output
    networks:
      lab:
        ipv4_address: ${NORMAL_USER_IP:?set NORMAL_USER_IP in .env}

networks:
  lab:
    # internal: no route to the internet, and Docker refuses to publish ports
    internal: true
    driver_opts:
      # fixed bridge name so Suricata knows where to capture
      com.docker.network.bridge.name: br-soclab
    ipam:
      config:
        - subnet: ${LAB_SUBNET:?set LAB_SUBNET in .env}

secrets:
  wazuh_enrollment:
    # Generated by scripts/setup.sh from .env (gitignored)
    file: ./wazuh/config/wazuh_cluster/authd.pass

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  victim-db-data:
  suricata-rules:
  suricata-logs:
