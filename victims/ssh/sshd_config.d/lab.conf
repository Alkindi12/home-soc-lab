# Deliberately weak for the lab: password logins allowed (brute-force target).
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 6
LogLevel VERBOSE
SyslogFacility AUTH
# OpenSSH 9.8+ penalises sources with repeated failed logins by refusing
# their connections for a while. A real mitigation, but it would stop the
# brute-force demo halfway, so the lab turns it off (see reports/04).
PerSourcePenalties no
